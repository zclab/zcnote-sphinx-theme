{# Displays the version of zcnote-sphinx-theme used to build the documentation. #}

  <!-- # L10n: We pass both versions to the translation block -->
  {% trans trimmed
      zcnote_version=zcnote_theme_version|e,
      zcnote_url="https://github.com/zcnote/zcnote-sphinx-theme"

  {% endtrans %}
</p>
