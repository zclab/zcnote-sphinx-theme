{% extends "pydata_sphinx_theme/layout.html" %}

{% block extrahead %}
    {{ super() }}
    <script>
        (function() {
            const enableCollapse = "{{ theme_enable_collapse_sidebar | default('true') | string | lower }}";
            document.documentElement.setAttribute("data-zcnote-collapse", enableCollapse);
            const hideHeader = "{{ theme_hide_header | default('false') | string | lower }}";
            if (hideHeader === "true" || hideHeader === "1") {
                document.documentElement.setAttribute("data-hide-header", "true");
            }
        })();
    </script>
{% endblock extrahead %}

{% block docs_main %}
    <script>
        (function(){
            try {
                var container = document.querySelector('.sidebar-primary-items__start');
                if (!container) return;

                var storage = null;
                try {
                    storage = window.sessionStorage;
                } catch(se) {}
                if (!storage) return;

                var getStorageKey = function() {
                    try {
                        var rootDir = document.documentElement.getAttribute('data-content_root') || './';
                        var rootPath = new URL(rootDir, window.location.href).pathname;
                        return 'zcnote_sidebar_scroll_' + rootPath;
                    } catch (e) {
                        return 'zcnote_sidebar_scroll_fallback';
                    }
                };

                var storageKey = getStorageKey();
                var saved = storage.getItem(storageKey);

                if (saved !== null) {
                    container.setAttribute('data-zcnote-scroll-restored', 'true');

                    var targetScroll = parseInt(saved, 10);
                    if (!isNaN(targetScroll) && targetScroll > 0) {
                        var originalBehavior = container.style.getPropertyValue('scroll-behavior');
                        container.style.setProperty('scroll-behavior', 'auto', 'important');

                        container.scrollTop = Math.round(targetScroll);

                        if (originalBehavior) {
                            container.style.setProperty('scroll-behavior', originalBehavior);
                        } else {
                            container.style.removeProperty('scroll-behavior');
                        }
                    }
                }
            } catch(e) {}
        })();
    </script>

    {{ super() }}
{% endblock docs_main %}
