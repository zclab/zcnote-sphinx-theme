{% extends "pydata_sphinx_theme/layout.html" %}

{# 模块 1：动态控制侧边栏折叠按钮 #}
{% block extrahead %}
    {{ super() }}
    {% if theme_enable_collapse_sidebar | string | lower == 'false' %}
        <style>
            .sidebar-primary-item.pst-sidebar-collapse,
            #pst-collapse-sidebar-button {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                pointer-events: none !important;
            }
        </style>
    {% endif %}
{% endblock extrahead %}

{# 模块 2 & 3：JS 布局引擎 #}
{% block footer %}
    {{ super() }}

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            // =========================================================
            // 模块 2：MkDocs-Material 零跳动滚动引擎
            // =========================================================
            const footer = document.querySelector(".bd-footer");
            if (footer) {
                const targetContainer = document.querySelector(".bd-article-container") ||
                                        document.querySelector(".bd-content") ||
                                        document.querySelector(".bd-main") ||
                                        document.body;

                if (footer.parentNode !== document.body) {
                    document.body.appendChild(footer);
                }

                const spacer = document.createElement("div");
                spacer.id = "zcnote-footer-spacer";
                spacer.style.cssText = "width: 100%; display: block; clear: both; pointer-events: none; flex-shrink: 0;";
                targetContainer.appendChild(spacer);

                let ticking = false;
                const root = document.documentElement;

                function updateLayout() {
                    const footerHeight = footer.offsetHeight;
                    const footerTop = footer.getBoundingClientRect().top;
                    const viewportHeight = window.innerHeight;

                    root.style.setProperty('--zcnote-vh', `${viewportHeight}px`);

                    if (spacer.style.height !== `${footerHeight}px`) {
                        spacer.style.height = `${footerHeight}px`;
                    }

                    let overlap = Math.max(0, viewportHeight - footerTop);
                    root.style.setProperty('--zcnote-footer-overlap', `${overlap}px`);

                    ticking = false;
                }

                function requestTick() {
                    if (!ticking) {
                        window.requestAnimationFrame(updateLayout);
                        ticking = true;
                    }
                }

                window.addEventListener("scroll", requestTick, { passive: true });
                window.addEventListener("resize", requestTick, { passive: true });

                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => requestTick());
                    ro.observe(footer);
                    ro.observe(document.body);
                }
                requestTick();
            }

            // =========================================================
            // 模块 3：侧边栏折叠按钮 - 物理流布局与绝对状态接管
            // =========================================================
            const sidebar = document.querySelector(".bd-sidebar-primary");
            const collapseBtnWrapper = document.querySelector(".sidebar-primary-item.pst-sidebar-collapse");
            const collapseBtn = document.querySelector("#pst-collapse-sidebar-button");

            if (sidebar && collapseBtnWrapper) {
                // 1. 移出侧边栏，插入到接缝处 (原生物理轨道)
                sidebar.parentNode.insertBefore(collapseBtnWrapper, sidebar.nextSibling);

                // 2. 状态接管：死死盯住按钮的展开/折叠状态
                if (collapseBtn) {
                    const toggleScrollbar = () => {
                        if (collapseBtn.getAttribute("aria-expanded") === "false") {
                            // 折叠时，强行注入我们专属的封杀类名
                            sidebar.classList.add("zcnote-hide-scrollbar");
                        } else {
                            // 展开时恢复
                            sidebar.classList.remove("zcnote-hide-scrollbar");
                        }
                    };

                    // 监听按钮属性变化
                    const observer = new MutationObserver(toggleScrollbar);
                    observer.observe(collapseBtn, { attributes: true, attributeFilter: ["aria-expanded"] });

                    // 初始化执行一次
                    toggleScrollbar();
                }
            }
        });
    </script>
{% endblock %}
