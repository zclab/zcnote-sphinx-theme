{% extends "pydata_sphinx_theme/layout.html" %}

{# =========================================================
   ZC-Note Sphinx Theme
   ========================================================= #}

{% block extrahead %}
    {{ super() }}

    <script>
        (function() {
            // 获取在 theme.conf 或 conf.py 中配置的侧边栏折叠开关
            const enableCollapse = "{{ theme_enable_collapse_sidebar | default('true') | string | lower }}";

            // 注入 data-zcnote-collapse 属性到 <html> 标签
            document.documentElement.setAttribute("data-zcnote-collapse", enableCollapse);
        })();
    </script>
{% endblock extrahead %}
