{% extends "pydata_sphinx_theme/layout.html" %}

{% block docs_sidebar_header %}
    {% if theme_enable_collapse_sidebar|lower == 'true' %}
        {{ super() }}
    {% else %}
        <div class="sidebar-brand"></div>
    {% endif %}
{% endblock docs_sidebar_header %}

{% block footer %}
    {{ super() }}

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const footer = document.querySelector(".bd-footer");

            // 【核心修正】：找到最深处的文章容器，而不是外层的 main
            const targetContainer = document.querySelector(".bd-article-container") || document.querySelector(".bd-content");

            if (!footer || !targetContainer) return;

            // 1. 降维转移：将 Footer 直接提升到 body 下，脱离所有网格束缚
            document.body.appendChild(footer);

            // 2. 内部支撑：将幽灵占位符注入到正文的最底部
            const spacer = document.createElement("div");
            spacer.style.width = "100%";
            spacer.style.pointerEvents = "none";
            // 确保占位符作为块级元素独占一行，提供纯粹的垂直高度
            spacer.style.display = "block";
            spacer.style.clear = "both";
            targetContainer.appendChild(spacer);

            // 3. 高度同步：测量 Footer 实际高度并更新占位符
            const observer = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const h = entry.contentRect.height;
                    document.documentElement.style.setProperty('--zcnote-footer-h', `${h}px`);
                    spacer.style.height = `${h}px`; // 同步撑开文章底部
                }
            });
            observer.observe(footer);
        });
    </script>
{% endblock %}
