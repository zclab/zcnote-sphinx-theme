[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zcnote-sphinx-theme"
version = "0.1.0"
dependencies = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16.0"
]

[project.entry-points."sphinx.html_themes"]
zcnote_sphinx_theme = "zcnote_sphinx_theme"
