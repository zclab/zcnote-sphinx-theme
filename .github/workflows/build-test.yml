name: Test Package Build

on:
  # 1. PR 自动触发：只有当代码准备合并进主干，且指定目录的文件发生修改时才触发
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pyproject.toml'

  # 2. 手动触发：允许你在 Actions 页面随时选择任意分支手动跑测试
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 测试多个 Python 版本，确保跨版本兼容性
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 安装 uv (极速，且自带缓存管理，替代旧的 setup-python + pip cache)
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # 2. 安装指定的 Python 版本 (由 uv 接管，速度极快)
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # (可选) 如果你后续添加了 pytest 等测试，这里是使用 uv 的推荐姿势
    # - name: Install package and dependencies
    #   run: uv pip install -e ".[doc]" pytest
    #
    # - name: Run tests
    #   run: uv run pytest

    # 3. 构建项目 (秒级生成 sdist 和 wheel)
    - name: Build the package
      run: uv build

    # 4. 检查包元数据 (使用 uvx 临时运行 twine，无需显式 pip install twine)
    - name: Check package metadata with Twine
      run: uvx twine check dist/*

