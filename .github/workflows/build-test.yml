name: Test Package Build

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'webpack.config.js'

  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # 1. 安装 uv
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # 2. 安装指定的 Python 版本
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # 3. 构建项目
    - name: Build the package
      run: uv build

    # 4. 检查包元数据 (校验 description, readme 等是否符合 PyPI 规范)
    - name: Check package metadata with Twine
      run: uvx twine check dist/*

    # =========================================================
    # 确保 Webpack 编译出的 css 和 js 确确实实被打包进了 wheel 中
    # =========================================================
    - name: Verify Wheel Contents (Frontend Assets)
      run: |
        WHEEL_FILE=$(ls dist/*.whl)
        echo "Checking contents of $WHEEL_FILE..."

        # 使用 unzip 检查 wheel 包内容（wheel 本质上是 zip 文件）
        # 寻找我们预期的 styles 和 scripts 目录下的文件
        unzip -l "$WHEEL_FILE" | grep -E "styles/.*\.css|scripts/.*\.js" || {
          echo "❌ Fatal Error: Frontend assets (CSS/JS) are missing in the wheel!"
          exit 1
        }

        echo "✅ Frontend assets successfully verified in the build package!"
