name: Test Package Build

on:
  # 1. PR 自动触发：只有当代码准备合并进主干，且指定目录的文件发生修改时才触发
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'

  # 2. 手动触发：允许你在 Actions 页面随时选择任意分支手动跑测试
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 测试多个 Python 版本，确保跨版本兼容性
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        # 安装官方推荐的打包工具 build 和元数据检查工具 twine
        pip install build twine

    # (可选) 如果你后续添加了 pytest 等单元测试，可以取消这里的注释
    # - name: Install dependencies
    #   run: pip install -r requirements.txt
    #
    # - name: Run tests
    #   run: pytest

    - name: Build the package
      run: python -m build

    - name: Check package metadata with Twine
      run: twine check dist/*
