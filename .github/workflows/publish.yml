name: Publish Package to PyPI

on:
  push:
    tags:
      - 'v*'  # 例如：推送 v0.1.0, v1.2.3 等 tag 时会触发

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # 定义环境，推荐与 PyPI 配置保持一致
    environment:
      name: pypi
      url: https://pypi.org/p/zcnote-sphinx-theme

    permissions:
      id-token: write
      contents: read

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v6

    # 2. 安装 uv
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # 3. 设置 Python 环境
    - name: Set up Python
      run: uv python install 3.12

    # 4. 构建项目
    - name: Build the package
      run: uv build

    # =========================================================
    # 如果 Webpack 构建静默失败导致没有生成 CSS/JS，立刻熔断，阻止上传！
    # =========================================================
    - name: Verify Wheel Contents Before Publishing
      run: |
        WHEEL_FILE=$(ls dist/*.whl)
        echo "Inspecting contents of $WHEEL_FILE before PyPI upload..."

        # 严格校验：必须同时存在编译后的样式和脚本文件
        unzip -l "$WHEEL_FILE" | grep -E "styles/.*\.css|scripts/.*\.js" || {
          echo "❌ Fatal Error: Frontend assets (CSS/JS) are missing in the wheel!"
          echo "🛑 Publish aborted to prevent releasing a broken package."
          exit 1
        }

        echo "✅ Frontend assets verified! The package is completely safe to publish."

    # 5. 上传到 PyPI
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
